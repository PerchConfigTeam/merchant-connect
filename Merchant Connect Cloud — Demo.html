    <style>
        :root { color-scheme: dark; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
        html { scroll-padding-top: env(safe-area-inset-top, 0px); background: #0f172a; }
        body { background: #0f172a; }
        header.sticky { top: env(safe-area-inset-top, 0px); }
        .brand-logo { filter: drop-shadow(0 0 6px rgba(95, 163, 214, 0.25)); }
        /* Wordmark initials in the logo's colours: navy-blue M, sky-blue C, blue-to-peach C */
        .mcc-wordmark { letter-spacing: -0.01em; }
        .mcc-i { font-weight: 900; -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 8px rgba(95, 163, 214, 0.25)); padding-right: 0.02em; }
        .mcc-m { background-image: linear-gradient(160deg, #6fb0e2 0%, #3f88c4 40%, #2b5f99 100%); }
        .mcc-c1 { background-image: linear-gradient(160deg, #a9d4f2 0%, #6aaee0 55%, #3f88c4 100%); }
        .mcc-c2 { background-image: linear-gradient(180deg, #8cc4ea 0%, #6aaee0 38%, #e7b48d 62%, #d9976a 100%); filter: drop-shadow(0 0 8px rgba(231, 180, 141, 0.25)); }
        @supports not ((-webkit-background-clip: text) or (background-clip: text)) {
            .mcc-i { -webkit-text-fill-color: currentColor; color: #6aaee0; } .mcc-c2 { color: #e7b48d; }
        }
        :focus-visible { outline: 2px solid #8cbfe5; outline-offset: 2px; }
        pre code { white-space: pre; }
    </style>

// UK postcode: returns normalised "LS1 6AZ" or null
function ukPostcode(v) {
    const s = String(v || '').toUpperCase().replace(/\s+/g, '');
    const m = s.match(/^([A-Z]{1,2}\d[A-Z\d]?)(\d[A-Z]{2})$/);
    return m ? `${m[1]} ${m[2]}` : null;
}
// UK phone: accepts 020 7946 0123, 07700 900123, +44 7700 900123
function ukPhone(v) {
    const d = String(v || '').replace(/[\s().-]/g, '');
    if (/^0\d{9,10}$/.test(d)) return String(v).trim();
    if (/^(\+44|0044|44)\d{9,10}$/.test(d)) return String(v).trim();
    return null;
}
// Companies House number: 8 digits, or 2 letters + 6 digits (e.g. SC123456)
function companyNumber(v) {
    const s = String(v || '').toUpperCase().replace(/\s+/g, '');
    if (/^\d{1,8}$/.test(s)) return s.padStart(8, '0');
    return /^[A-Z]{2}\d{6}$/.test(s) ? s : null;
}

function authenticate(apiKey) {
    if (apiKey !== undefined) {
        const k = DB.apiKeys.find((x) => x.key === apiKey && !x.revokedAt);
        const u = k && DB.users.find((x) => x.id === k.userId);
        if (!k || !u || u.status !== 'active' || u.lockedAt) throw new ApiError(401, 'Invalid or revoked API key');
        k.lastUsedAt = nowIso();
        return { user: publicUser(u), via: 'api_key', scopes: k.scopes };
    }
    const sess = DB.session && typeof DB.session === 'object' && !DB.session.setup ? DB.session : null;
    const u = sess && DB.users.find((x) => x.id === sess.userId);
    return u && u.status === 'active' && !u.lockedAt ? { user: publicUser(u), via: 'session', scopes: ['*'] } : null;
}

async function demoRoute(method, path, q, b, auth) {
    const need = (o = {}) => {
        if (!auth) throw new ApiError(401, 'Sign in or provide an API key');
        if (o.session && auth.via !== 'session') throw new ApiError(403, 'This endpoint is only available when signed in to the portal');
        if (o.admin && auth.user.role !== 'admin') throw new ApiError(403, 'Admin access required');
        if (o.scope && auth.via === 'api_key' && !auth.scopes.includes(o.scope)) throw new ApiError(403, `This API key is missing the "${o.scope}" scope`);
    };
    let m;
    const is = (meth, re) => method === meth && (m = path.match(re));
    const admin = () => auth.user.role === 'admin';

    /* ---------- auth ---------- */
    const findByEmail = (e) => DB.users.find((x) => x.email === String(e || '').trim().toLowerCase());
    const LOCKED_MSG = `Your account is locked after ${MAX_SIGN_IN_ATTEMPTS} unsuccessful sign-in attempts. Contact Merchant Connect support (${SUPPORT_EMAIL}) to unlock it.`;
    const recordFailure = (u, wrongMsg = 'Incorrect email or password.') => {
        u.failedAttempts = (u.failedAttempts || 0) + 1;
        if (u.failedAttempts >= MAX_SIGN_IN_ATTEMPTS) {
            u.lockedAt = nowIso();
            if (DB.session && DB.session.userId === u.id) DB.session = null;
            sendEmail(u.email, 'Your Merchant Connect Cloud account has been locked', [`Hi ${u.name},`, `We locked your account after ${MAX_SIGN_IN_ATTEMPTS} unsuccessful attempts to sign in. This protects your account if someone else is trying to get in.`, `To unlock it, contact our partner support team at ${SUPPORT_EMAIL}. If you didn't try to sign in, let us know straight away.`]);
            sendEmail(SUPPORT_EMAIL, `Account locked: ${u.name}`, [`${u.name} (${u.email}) was locked out after ${MAX_SIGN_IN_ATTEMPTS} unsuccessful sign-in attempts.`, 'You can unlock the account from the Partners page once you have confirmed it is them.']);
            throw new ApiError(423, LOCKED_MSG);
        }
        const left = MAX_SIGN_IN_ATTEMPTS - u.failedAttempts;
        throw new ApiError(wrongMsg.startsWith('Incorrect email') ? 401 : 400, `${wrongMsg} ${left} attempt${left === 1 ? '' : 's'} left before your account is locked.`);
    };
    const startSession = (u) => { u.failedAttempts = 0; u.lastSignInAt = nowIso(); DB.session = { userId: u.id }; return { user: publicUser(u) }; };

    if (is('GET', /^\/auth\/setup-status$/)) return { needsSetup: false };

    // Partner application: no password yet. A one-time password is emailed once an admin approves it.
    if (is('POST', /^\/auth\/register$/)) {
        const fullName = cleanStr(b.fullName, 120); const company = cleanStr(b.company, 160);
        const email = (cleanStr(b.email, 254) || '').toLowerCase(); const phone = ukPhone(b.phone);
        if (!fullName) throw new ApiError(400, 'Enter your full name');
        if (!company) throw new ApiError(400, 'Enter your company or trading name');
        if (!EMAIL_RE.test(email)) throw new ApiError(400, 'Enter a valid email address');
        if (!phone) throw new ApiError(400, 'Enter a UK phone number, e.g. 07700 900123');
        if (DB.users.some((u) => u.email === email)) throw new ApiError(409, 'An account or application already exists for that email. Sign in, or reset your password.');
        const u = { id: uid('u'), name: company, email, role: 'seller', company, status: 'pending', passwordHash: null, otp: null, failedAttempts: 0, lockedAt: null, createdAt: nowIso(),
            profile: { fullName, companyName: company, phones: { primary: phone, primaryType: 'Mobile', secondary: null, secondaryType: null } } };
        DB.users.push(u);
        sendEmail(email, 'We’ve received your partner application', [`Hi ${fullName},`, `Thanks for applying to become a Merchant Connect Cloud partner on behalf of ${company}.`, 'Our team will review your application, usually within one working day. When it’s approved we’ll email you a one-time password so you can sign in and create your own password.']);
        sendEmail(SUPPORT_EMAIL, `New partner application: ${company}`, [`${fullName} has applied to become a partner for ${company}.`, `Email: ${email}`, `Phone: ${phone}`, 'Review it on the Partners page.']);
        return { applied: true };
    }

    if (is('POST', /^\/auth\/login$/)) {
        const u = findByEmail(b.email); const pw = String(b.password || '');
        if (!u) throw new ApiError(401, 'Incorrect email or password.');
        if (u.lockedAt) throw new ApiError(423, LOCKED_MSG);
        if (u.status === 'pending') throw new ApiError(403, 'Your partner application is still being reviewed. We’ll email you a one-time password as soon as it’s approved.');
        if (u.status === 'rejected') throw new ApiError(403, 'This partner application was not approved. Contact us if you think this is a mistake.');
        if (u.status === 'deactivated') throw new ApiError(403, `This account has been deactivated. Contact ${SUPPORT_EMAIL}.`);
        if (u.status === 'awaiting_password') {
            if (!u.otp || new Date(u.otp.expiresAt) < new Date()) throw new ApiError(401, 'Your one-time password has expired. Contact us and we’ll send you a new one.');
            if ((await sha256Hex(normOtp(pw))) !== u.otp.hash) recordFailure(u);
            u.failedAttempts = 0;
            DB.session = { userId: u.id, setup: true };
            return { passwordSetupRequired: true, name: u.profile?.fullName || u.name, email: u.email };
        }
        if (!(await verifyPassword(pw, u.passwordHash))) recordFailure(u);
        return startSession(u);
    }

    // First sign-in: swap the one-time password for the partner's own password.
    if (is('POST', /^\/auth\/set-password$/)) {
        const u = DB.session && DB.session.setup && DB.users.find((x) => x.id === DB.session.userId);
        if (!u) throw new ApiError(401, 'Your session has expired. Sign in again with your one-time password.');
        const pw = String(b.password || '');
        if (pw !== String(b.confirm || '')) throw new ApiError(400, 'The two passwords don’t match.');
        const problem = passwordProblem(pw, u.email); if (problem) throw new ApiError(400, problem);
        u.passwordHash = await hashPassword(pw); u.passwordSetAt = nowIso(); u.status = 'active'; u.otp = null;
        sendEmail(u.email, 'Your password has been created', [`Hi ${u.profile?.fullName || u.name},`, 'Your Merchant Connect Cloud password has been set and your one-time password can no longer be used.', 'Next, sign in and complete your account information, including your bank details, so we can pay your commission.']);
        return startSession(u);
    }

    if (is('POST', /^\/auth\/forgot-password$/)) {
        const u = findByEmail(b.email);
        if (u && u.status === 'active') {
            if (u.lockedAt) {
                sendEmail(u.email, 'Password reset requested', [`Hi ${u.profile?.fullName || u.name},`, 'Someone asked to reset the password for your account, but your account is currently locked after too many unsuccessful sign-in attempts.', `Contact partner support at ${SUPPORT_EMAIL} to unlock it.`]);
            } else {
                const code = newOtp();
                u.otp = { hash: await sha256Hex(normOtp(code)), purpose: 'reset', expiresAt: hoursFromNow(OTP_RESET_MINUTES / 60), attempts: 0 };
                sendEmail(u.email, 'Reset your Merchant Connect Cloud password', [`Hi ${u.profile?.fullName || u.name},`, 'Use this code to reset your password:', `It expires in ${OTP_RESET_MINUTES} minutes and can only be used once. If you didn’t ask to reset your password, you can ignore this email.`], code);
            }
        }
        // Same answer whether or not the account exists, so this can't be used to discover partner emails.
        return { message: `If there’s an account for that email, we’ve sent a reset code. It expires in ${OTP_RESET_MINUTES} minutes.` };
    }

    if (is('POST', /^\/auth\/reset-password$/)) {
        const u = findByEmail(b.email);
        if (!u || u.status !== 'active' || !u.otp || u.otp.purpose !== 'reset') throw new ApiError(400, 'That reset code is invalid or has expired. Request a new one.');
        if (u.lockedAt) throw new ApiError(423, LOCKED_MSG);
        if (new Date(u.otp.expiresAt) < new Date()) { u.otp = null; throw new ApiError(400, 'That reset code has expired. Request a new one.'); }
        if ((await sha256Hex(normOtp(b.code))) !== u.otp.hash) {
            u.otp.attempts++;
            if (u.otp.attempts >= MAX_SIGN_IN_ATTEMPTS) { u.otp = null; throw new ApiError(400, 'Too many incorrect codes. Request a new reset code.'); }
            const left = MAX_SIGN_IN_ATTEMPTS - u.otp.attempts;
            throw new ApiError(400, `That code isn’t right. ${left} tr${left === 1 ? 'y' : 'ies'} left.`);
        }
        const pw = String(b.password || '');
        if (pw !== String(b.confirm || '')) throw new ApiError(400, 'The two passwords don’t match.');
        const problem = passwordProblem(pw, u.email); if (problem) throw new ApiError(400, problem);
        u.passwordHash = await hashPassword(pw); u.passwordSetAt = nowIso(); u.otp = null; u.failedAttempts = 0;
        sendEmail(u.email, 'Your password was changed', [`Hi ${u.profile?.fullName || u.name},`, 'Your Merchant Connect Cloud password was just reset.', `If this wasn’t you, contact ${SUPPORT_EMAIL} immediately.`]);
        return { ok: true };
    }

    if (is('POST', /^\/auth\/change-password$/)) {
        need({ session: true });
        const u = DB.users.find((x) => x.id === auth.user.id);
        if (!(await verifyPassword(String(b.current || ''), u.passwordHash))) recordFailure(u, 'Your current password isn’t right.');
        const pw = String(b.password || '');
        if (pw !== String(b.confirm || '')) throw new ApiError(400, 'The two new passwords don’t match.');
        const problem = passwordProblem(pw, u.email); if (problem) throw new ApiError(400, problem);
        u.passwordHash = await hashPassword(pw); u.passwordSetAt = nowIso(); u.failedAttempts = 0;
        sendEmail(u.email, 'Your password was changed', [`Hi ${u.profile?.fullName || u.name},`, 'Your Merchant Connect Cloud password was just changed from your account page.', `If this wasn’t you, contact ${SUPPORT_EMAIL} immediately.`]);
        return { ok: true };
    }

    // Demo only: quick switch between sample accounts without typing passwords. Still respects locks and status.
    if (is('POST', /^\/auth\/demo-login$/)) {
        const u = findByEmail(b.email);
        if (!u) throw new ApiError(404, 'Demo account not found');
        if (u.lockedAt) throw new ApiError(423, `${u.name} is locked. Sign in as Admin and unlock them on the Partners page, or reset the demo.`);
        if (u.status !== 'active') throw new ApiError(403, `${u.name} can’t sign in yet (status: ${u.status.replace('_', ' ')}).`);
        return startSession(u);
    }
    if (is('POST', /^\/auth\/logout$/)) { DB.session = null; return { ok: true }; }
    if (is('GET', /^\/auth\/me$/)) { need({ session: true }); return { user: auth.user }; }

    /* ---------- dashboard ---------- */
    if (is('GET', /^\/leaderboard$/)) {
        need({ session: true, admin: true });
        const days = { '30': 30, '90': 90, '365': 365 }[q.get('period')] || null; // null = all time
        const since = days ? Date.now() - days * 86400000 : -Infinity;
        const inPeriod = (iso) => !!iso && new Date(iso).getTime() >= since;
        const rows = DB.users.filter((u) => u.role === 'seller').map((u) => {
            const mine = DB.leads.filter((l) => l.sellerId === u.id);
            const sold = mine.filter((l) => l.status === 'Sold' && inPeriod(l.soldAt || l.updatedAt));
            const submitted = mine.filter((l) => inPeriod(l.createdAt));
            const lastSale = sold.map((l) => l.soldAt || l.updatedAt).sort().pop() || null;
            return {
                id: u.id, name: u.name, contact: (u.profile && u.profile.fullName) || '', status: u.status,
                sales: sold.length, commission: sold.reduce((a, l) => a + l.commission, 0),
                leads: submitted.length, conversion: submitted.length ? Math.round((submitted.filter((l) => l.status === 'Sold').length / submitted.length) * 100) : null,
                lastSaleAt: lastSale,
            };
        }).filter((r) => r.status === 'active' || r.sales > 0 || r.leads > 0);
        // Most sales first; ties split by commission earned, then leads submitted.
        rows.sort((a, c) => c.sales - a.sales || c.commission - a.commission || c.leads - a.leads || a.name.localeCompare(c.name));
        let rank = 0;
        rows.forEach((r, i) => { if (i === 0 || r.sales !== rows[i - 1].sales || r.commission !== rows[i - 1].commission) rank = i + 1; r.rank = rank; });
        return {
            period: days ? String(days) : 'all', rows,
            totals: { sales: rows.reduce((a, r) => a + r.sales, 0), commission: rows.reduce((a, r) => a + r.commission, 0), partnersSelling: rows.filter((r) => r.sales > 0).length },
        };
    }
    if (is('GET', /^\/stats$/)) {
        need();
        const leads = admin() ? DB.leads : DB.leads.filter((l) => l.sellerId === auth.user.id);
        const rems = admin() ? DB.remittances : DB.remittances.filter((r) => r.sellerId === auth.user.id);
        const sold = leads.filter((l) => l.status === 'Sold');
        const earned = sold.reduce((a, l) => a + l.commission, 0);
        const sum = (st) => rems.filter((r) => r.status === st).reduce((a, r) => a + r.amount, 0);
        const cutoff = new Date(); cutoff.setDate(1); cutoff.setMonth(cutoff.getMonth() - 5); cutoff.setHours(0, 0, 0, 0);
        const months = {};
        for (const l of leads) {
            const d = new Date(l.createdAt);
            if (d < cutoff) continue;
            const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            months[key] = months[key] || { month: key, submitted: 0, sold: 0 };
            months[key].submitted++; if (l.status === 'Sold') months[key].sold++;
        }
        return {
            leads: { total: leads.length, sold: sold.length, qualified: leads.filter((l) => l.status === 'Qualified').length, pendingReview: leads.filter((l) => l.status === 'Pending Review').length },
            commissionsEarned: earned, payouts: { pending: sum('Pending'), paid: sum('Paid') },
            available: admin() ? null : Math.max(0, earned - sum('Pending') - sum('Paid')),
            pendingPartners: admin() ? DB.users.filter((u) => u.status === 'pending').length : null,
            lockedPartners: admin() ? DB.users.filter((u) => u.lockedAt).length : null,
            account: admin() ? null : accountCompleteness((DB.users.find((u) => u.id === auth.user.id) || {}).profile),
            monthly: Object.values(months).sort((a, c) => a.month.localeCompare(c.month)),
        };
    }

    /* ---------- leads ---------- */
    if (is('GET', /^\/leads$/)) {
        need({ scope: 'leads:read' });
        let rows = admin() ? DB.leads : DB.leads.filter((l) => l.sellerId === auth.user.id);
        const status = q.get('status');
        if (status) { if (!LEAD_STATUSES.includes(status)) throw new ApiError(400, `status must be one of: ${LEAD_STATUSES.join(', ')}`); rows = rows.filter((l) => l.status === status); }
        if (q.get('updatedSince')) { const t = new Date(q.get('updatedSince')); rows = rows.filter((l) => new Date(l.updatedAt) >= t); }
        rows = [...rows].sort((a, c) => c.createdAt.localeCompare(a.createdAt));
        const limit = Math.min(500, Math.max(1, parseInt(q.get('limit'), 10) || 100));
        const offset = Math.max(0, parseInt(q.get('offset'), 10) || 0);
        const page = rows.slice(offset, offset + limit);
        return { leads: page.map(leadOut), limit, offset, hasMore: offset + limit < rows.length };
    }
    if (is('POST', /^\/leads$/)) {
        need({ scope: 'leads:write' });
        const lead = {
            businessName: cleanStr(b.businessName, 200), contactName: cleanStr(b.contactName, 200), phone: cleanStr(b.phone, 50),
            email: cleanStr(b.email, 254), currentProvider: cleanStr(b.currentProvider, 100), monthlyVolume: cleanStr(b.monthlyVolume, 100),
            notes: cleanStr(b.notes, 4000), externalId: cleanStr(b.externalId, 200),
            postcode: cleanStr(b.postcode, 10), businessType: cleanStr(b.businessType, 40), companyNumber: cleanStr(b.companyNumber, 10),
        };
        if (lead.phone) { lead.phone = ukPhone(lead.phone); if (!lead.phone) throw new ApiError(400, 'phone must be a UK number, e.g. 020 7946 0123 or +44 7700 900123'); }
        if (lead.postcode) { lead.postcode = ukPostcode(lead.postcode); if (!lead.postcode) throw new ApiError(400, 'postcode is not a valid UK postcode, e.g. LS1 6AZ'); }
        if (lead.businessType && !UK_BUSINESS_TYPES.includes(lead.businessType)) throw new ApiError(400, `businessType must be one of: ${UK_BUSINESS_TYPES.join(', ')}`);
        if (lead.companyNumber) { lead.companyNumber = companyNumber(lead.companyNumber); if (!lead.companyNumber) throw new ApiError(400, 'companyNumber must be a Companies House number, e.g. 01234567 or SC123456'); }
        if (b.contactConsent !== true && b.contactConsent !== 'true' && b.contactConsent !== 'on') {
            throw new ApiError(400, 'contactConsent must be true: confirm the merchant agreed to their details being passed on and to being contacted (UK GDPR)');
        }
        lead.contactConsentAt = nowIso();
        if (!lead.businessName) throw new ApiError(400, 'businessName is required');
        if (!lead.contactName) throw new ApiError(400, 'contactName is required');
        if (!lead.phone && !lead.email) throw new ApiError(400, 'Provide a phone number or email for the contact');
        if (lead.email && !EMAIL_RE.test(lead.email)) throw new ApiError(400, 'email is not a valid address');
        let sellerId = auth.user.id; let house = false;
        if (admin()) {
            if (b.sellerId) {
                const s = DB.users.find((u) => u.id === b.sellerId && u.role === 'seller');
                if (!s) throw new ApiError(400, 'sellerId does not match a partner account');
                sellerId = s.id;
            } else house = true;
        }
        if (lead.externalId) {
            const existing = DB.leads.find((l) => l.sellerId === sellerId && l.externalId === lead.externalId);
            if (existing) return { lead: leadOut(existing), duplicate: true };
        }
        const s = DB.settings;
        const row = {
            id: uid('lead'), sellerId, ...lead,
            source: auth.via === 'api_key' ? 'api' : admin() ? 'admin' : 'portal',
            status: s.autoQualifyLeads ? 'Qualified' : 'Pending Review',
            commission: house ? 0 : s.flatCommissionRate + (isHighVolume(lead.monthlyVolume) ? s.highVolumeBonus : 0),
            createdAt: nowIso(), updatedAt: nowIso(),
        };
        DB.leads.unshift(row);
        emit('lead.created', { lead: leadOut(row) });
        return { lead: leadOut(row) };
    }
    if (is('GET', /^\/leads\/([\w-]+)$/)) {
        need({ scope: 'leads:read' });
        const l = DB.leads.find((x) => x.id === m[1]);
        if (!l || (!admin() && l.sellerId !== auth.user.id)) throw new ApiError(404, 'Lead not found');
        return { lead: leadOut(l) };
    }
    if (is('PATCH', /^\/leads\/([\w-]+)$/)) {
        need({ session: true, admin: true });
        const l = DB.leads.find((x) => x.id === m[1]);
        if (!l) throw new ApiError(404, 'Lead not found');
        const prev = l.status;
        if (b.status !== undefined) { if (!LEAD_STATUSES.includes(b.status)) throw new ApiError(400, 'Invalid status'); l.status = b.status; }
        if (b.commission !== undefined) { const c = Number(b.commission); if (!Number.isFinite(c) || c < 0) throw new ApiError(400, 'commission must be 0 or more'); l.commission = Math.round(c * 100) / 100; }
        if (b.notes !== undefined) l.notes = cleanStr(b.notes, 4000);
        l.updatedAt = nowIso();
        if (prev !== l.status) l.soldAt = l.status === 'Sold' ? nowIso() : null;
        const out = leadOut(l);
        emit('lead.updated', { lead: out });
        if (prev !== l.status) { emit('lead.status_changed', { lead: out, previousStatus: prev }); if (l.status === 'Sold') emit('lead.sold', { lead: out }); }
        return { lead: out };
    }

    /* ---------- remittances ---------- */
    if (is('GET', /^\/remittances$/)) {
        need({ scope: 'remittances:read' });
        const rows = (admin() ? DB.remittances : DB.remittances.filter((r) => r.sellerId === auth.user.id))
            .slice().sort((a, c) => c.requestedAt.localeCompare(a.requestedAt));
        return { remittances: rows.map(remOut), balance: admin() ? null : sellerBalance(auth.user.id) };
    }
    if (is('POST', /^\/remittances$/)) {
        need({ session: true });
        if (admin()) throw new ApiError(403, 'Only partner accounts can request payouts');
        const me = DB.users.find((u) => u.id === auth.user.id); const prof = me.profile || {};
        if (!prof.bank) throw new ApiError(400, 'Add your bank details on the My account page before requesting a payout.');
        if (!(prof.rightToWork && prof.rightToWork.declared)) throw new ApiError(400, 'Complete your right to work declaration on the My account page before requesting a payout.');
        const amount = Math.round(Number(b.amount) * 100) / 100;
        const method = `${b.type === 'BACS' ? 'BACS' : 'Faster Payments'} to account ending ${prof.bank.accountNumber.slice(-4)}`;
        if (!Number.isFinite(amount) || amount <= 0) throw new ApiError(400, 'amount must be greater than 0');
        if (amount > sellerBalance(auth.user.id).available) throw new ApiError(400, 'Amount is more than your available balance');
        const r = { id: uid('rem'), sellerId: auth.user.id, amount, method, status: 'Pending', reference: null, note: null, requestedAt: nowIso(), paidAt: null };
        DB.remittances.unshift(r);
        emit('remittance.requested', { remittance: remOut(r) });
        return { remittance: remOut(r), balance: sellerBalance(auth.user.id) };
    }
    if (is('POST', /^\/remittances\/([\w-]+)\/(pay|reject)$/)) {
        need({ session: true, admin: true });
        const r = DB.remittances.find((x) => x.id === m[1]);
        if (!r || r.status !== 'Pending') throw new ApiError(409, 'Only pending payouts can be updated');
        if (m[2] === 'pay') { r.status = 'Paid'; r.paidAt = nowIso(); r.reference = cleanStr(b && b.reference, 120) || 'TXN-' + Math.floor(100000 + Math.random() * 900000); }
        else { r.status = 'Rejected'; r.note = cleanStr(b && b.reason, 500); }
        emit(m[2] === 'pay' ? 'remittance.paid' : 'remittance.rejected', { remittance: remOut(r) });
        return { remittance: remOut(r) };
    }

    /* ---------- partners (admin) ---------- */
    const partnerOut = (u) => ({
        ...publicUser(u),
        passwordSet: !!u.passwordHash, passwordSetAt: u.passwordSetAt || null,
        otpIssuedAt: u.otp && u.otp.purpose === 'activation' ? u.otp.issuedAt : null, otpExpiresAt: u.otp && u.otp.purpose === 'activation' ? u.otp.expiresAt : null,
        failedAttempts: u.failedAttempts || 0, lockedAt: u.lockedAt || null, lastSignInAt: u.lastSignInAt || null,
        leadCount: DB.leads.filter((l) => l.sellerId === u.id).length,
        profile: profileOut(u.profile || {}),
    });
    const findUser = (id) => { const u = DB.users.find((x) => x.id === id); if (!u) throw new ApiError(404, 'User not found'); return u; };
    const issueActivationOtp = async (u) => {
        const code = newOtp();
        u.otp = { hash: await sha256Hex(normOtp(code)), purpose: 'activation', issuedAt: nowIso(), expiresAt: hoursFromNow(OTP_ACTIVATION_HOURS) };
        sendEmail(u.email, 'Your partner application is approved', [`Hi ${u.profile?.fullName || u.name},`, `Good news: ${u.company} has been approved as a Merchant Connect Cloud partner.`, `Sign in with your email address (${u.email}) and this one-time password:`, `It expires in ${OTP_ACTIVATION_HOURS} hours and only works once. When you sign in, you’ll be asked to create your own password. We will never ask you for this code.`], code);
    };

    if (is('GET', /^\/users$/)) {
        need({ session: true, admin: true });
        const order = { pending: 0, awaiting_password: 1, active: 2, deactivated: 3, rejected: 4 };
        const users = DB.users.slice().sort((a, c) => (!!c.lockedAt - !!a.lockedAt) || (order[a.status] - order[c.status]) || c.createdAt.localeCompare(a.createdAt));
        return { users: users.map(partnerOut) };
    }
    if (is('GET', /^\/users\/([\w-]+)$/)) { need({ session: true, admin: true }); return { user: partnerOut(findUser(m[1])) }; }
    if (is('POST', /^\/users\/([\w-]+)\/(approve|reject|resend-otp|unlock|deactivate|reactivate)$/)) {
        need({ session: true, admin: true });
        const u = findUser(m[1]); const act = m[2];
        if (u.id === auth.user.id) throw new ApiError(400, 'You cannot change your own account here');
        if (act === 'approve') {
            if (u.status !== 'pending') throw new ApiError(409, 'Only pending applications can be approved');
            u.status = 'awaiting_password'; u.approvedAt = nowIso();
            await issueActivationOtp(u);
        } else if (act === 'reject') {
            if (u.status !== 'pending') throw new ApiError(409, 'Only pending applications can be rejected');
            u.status = 'rejected';
            sendEmail(u.email, 'Your partner application', [`Hi ${u.profile?.fullName || u.name},`, `Thank you for applying to become a Merchant Connect Cloud partner. Unfortunately we’re unable to approve the application for ${u.company} at this time.`, cleanStr(b.reason, 500) ? `Reason: ${cleanStr(b.reason, 500)}` : 'If you have any questions, reply to this email.']);
        } else if (act === 'resend-otp') {
            if (u.status !== 'awaiting_password') throw new ApiError(409, 'A one-time password can only be resent before the partner has set their password');
            await issueActivationOtp(u);
        } else if (act === 'unlock') {
            if (!u.lockedAt) throw new ApiError(409, 'This account is not locked');
            u.lockedAt = null; u.failedAttempts = 0;
            sendEmail(u.email, 'Your account has been unlocked', [`Hi ${u.profile?.fullName || u.name},`, 'Your Merchant Connect Cloud account has been unlocked and you can sign in again.', 'If you’ve forgotten your password, use “Forgot your password?” on the sign-in page.']);
        } else if (act === 'deactivate') {
            if (u.status !== 'active') throw new ApiError(409, 'Only active accounts can be deactivated');
            u.status = 'deactivated';
        } else if (act === 'reactivate') {
            if (u.status !== 'deactivated') throw new ApiError(409, 'Only deactivated accounts can be reactivated');
            u.status = u.passwordHash ? 'active' : 'awaiting_password';
        }
        return { user: partnerOut(u) };
    }

    /* ---------- partner account information ---------- */
    if (is('GET', /^\/account$/)) {
        need({ session: true });
        const u = findUser(auth.user.id);
        return { profile: profileOut(u.profile || {}), email: u.email, passwordSetAt: u.passwordSetAt || null, lastSignInAt: u.lastSignInAt || null };
    }
    if (is('POST', /^\/account\/bank\/check$/)) { need({ session: true }); return modulusCheck(b.sortCode, b.accountNumber); }
    if (is('PUT', /^\/account\/(details|address|phones|bank|next-of-kin|right-to-work)$/)) {
        need({ session: true });
        if (admin()) throw new ApiError(403, 'Account information is for partner accounts');
        const u = findUser(auth.user.id); u.profile = u.profile || {}; const p = u.profile; const section = m[1];
        if (section === 'details') {
            const fullName = cleanStr(b.fullName, 120); if (!fullName || fullName.length < 2) throw new ApiError(400, 'Enter your full name');
            p.fullName = fullName; p.companyName = cleanStr(b.companyName, 160);
            if (p.companyName) { u.company = p.companyName; u.name = p.companyName; }
        } else if (section === 'address') {
            const line1 = cleanStr(b.line1, 120), town = cleanStr(b.town, 80), postcode = ukPostcode(b.postcode);
            if (!line1) throw new ApiError(400, 'Enter the first line of your address');
            if (!town) throw new ApiError(400, 'Enter your town or city');
            if (!postcode) throw new ApiError(400, 'Enter a valid UK postcode, e.g. LS1 6AZ');
            p.address = { line1, line2: cleanStr(b.line2, 120), town, county: cleanStr(b.county, 80), postcode };
        } else if (section === 'phones') {
            const primary = ukPhone(b.primary); if (!primary) throw new ApiError(400, 'Enter a UK main phone number, e.g. 07700 900123');
            const secondary = cleanStr(b.secondary, 20) ? ukPhone(b.secondary) : null;
            if (cleanStr(b.secondary, 20) && !secondary) throw new ApiError(400, 'The second phone number isn’t a valid UK number');
            if (secondary && secondary.replace(/\D/g, '') === primary.replace(/\D/g, '')) throw new ApiError(400, 'The second phone number is the same as the first');
            const type = (t) => (PHONE_TYPES.includes(t) ? t : 'Mobile');
            p.phones = { primary, primaryType: type(b.primaryType), secondary, secondaryType: secondary ? type(b.secondaryType) : null };
        } else if (section === 'bank') {
            if (!(await verifyPassword(String(b.currentPassword || ''), u.passwordHash))) recordFailure(u, 'Your password isn’t right.');
            u.failedAttempts = 0;
            const accountName = cleanStr(b.accountName, 70); if (!accountName) throw new ApiError(400, 'Enter the name on the bank account');
            const check = modulusCheck(b.sortCode, b.accountNumber);
            if (!check.valid) throw new ApiError(400, check.reason);
            const changed = !!p.bank;
            p.bank = { accountName, bankName: cleanStr(b.bankName, 80), sortCode: check.sortCode, accountNumber: check.account, check: { status: check.checked ? 'passed' : 'not_checkable', detail: check.reason, at: nowIso() }, updatedAt: nowIso() };
            sendEmail(u.email, changed ? 'Your bank details were changed' : 'Your bank details were added', [`Hi ${p.fullName || u.name},`, `The bank account we pay your commission into is now: sort code ${fmtSortCode(check.sortCode)}, account ending ${check.account.slice(-4)}.`, `If you didn’t make this change, contact ${SUPPORT_EMAIL} immediately. We will never ask you to change bank details by phone or email.`]);
        } else if (section === 'next-of-kin') {
            const name = cleanStr(b.name, 120), relationship = cleanStr(b.relationship, 40), phone = intlPhone(b.phone), email = cleanStr(b.email, 254);
            if (!name) throw new ApiError(400, 'Enter your next of kin’s full name');
            if (!NOK_RELATIONSHIPS.includes(relationship)) throw new ApiError(400, 'Choose their relationship to you');
            if (!phone) throw new ApiError(400, 'Enter a phone number for your next of kin (UK, or international starting with +)');
            if (email && !EMAIL_RE.test(email)) throw new ApiError(400, 'Next of kin email isn’t valid');
            p.nextOfKin = { name, relationship, phone, email };
        } else if (section === 'right-to-work') {
            if (b.declared !== true && b.declared !== 'on') throw new ApiError(400, 'Tick the declaration to confirm your right to work in the UK');
            const basis = cleanStr(b.basis, 100); if (!RTW_BASES.includes(basis)) throw new ApiError(400, 'Choose the basis of your right to work');
            let shareCode = cleanStr(b.shareCode, 20) ? String(b.shareCode).toUpperCase().replace(/[^A-Z0-9]/g, '') : null;
            if (basis !== RTW_BASES[0] && !shareCode) throw new ApiError(400, 'Enter your share code from GOV.UK “Prove your right to work”');
            if (shareCode && !/^[A-Z0-9]{9}$/.test(shareCode)) throw new ApiError(400, 'A share code is 9 letters and numbers, e.g. W12 345 67X');
            const signedName = cleanStr(b.signedName, 120);
            if (!signedName) throw new ApiError(400, 'Type your full name to sign the declaration');
            if (p.fullName && signedName.toLowerCase() !== p.fullName.toLowerCase()) throw new ApiError(400, `Type your name exactly as it appears in “Your details” (${p.fullName})`);
            p.rightToWork = { declared: true, basis, shareCode, signedName, declaredAt: nowIso() };
        }
        p.updatedAt = nowIso();
        return { profile: profileOut(p) };
    }

    /* ---------- settings ---------- */
    if (is('GET', /^\/settings$/)) { need({ session: true, admin: true }); return { settings: DB.settings }; }
    if (is('PUT', /^\/settings$/)) {
        need({ session: true, admin: true });
        for (const k of ['flatCommissionRate', 'highVolumeBonus']) {
            if (b[k] !== undefined) { const n = Number(b[k]); if (!Number.isFinite(n) || n < 0) throw new ApiError(400, `${k} must be 0 or more`); DB.settings[k] = n; }
        }
        for (const k of ['autoQualifyLeads', 'requirePartnerApproval']) if (b[k] !== undefined) DB.settings[k] = !!b[k];
        return { settings: DB.settings };
    }

    /* ---------- API keys ---------- */
    if (is('GET', /^\/keys$/)) {
        need({ session: true });
        const keys = DB.apiKeys.filter((k) => k.userId === auth.user.id && !k.revokedAt)
            .map((k) => ({ id: k.id, name: k.name, prefix: k.key.slice(0, 12), scopes: k.scopes, lastUsedAt: k.lastUsedAt, createdAt: k.createdAt }));
        return { keys, availableScopes: API_SCOPES };
    }
    if (is('POST', /^\/keys$/)) {
        need({ session: true });
        const name = cleanStr(b.name, 80);
        if (!name) throw new ApiError(400, 'Give the key a name, e.g. "Website form"');
        const scopes = Array.isArray(b.scopes) && b.scopes.length ? [...new Set(b.scopes)] : ['leads:write', 'leads:read'];
        if (!scopes.every((s) => API_SCOPES.includes(s))) throw new ApiError(400, 'Unknown scope');
        const key = 'plk_' + Array.from(crypto.getRandomValues(new Uint8Array(16)), (x) => x.toString(16).padStart(2, '0')).join('');
        DB.apiKeys.unshift({ id: uid('key'), userId: auth.user.id, name, key, scopes, lastUsedAt: null, createdAt: nowIso(), revokedAt: null });
        return { name, key, scopes, note: 'Copy this key now. In the live app it is never shown again. (In this demo it is also filled into "Try the API" below.)' };
    }
    if (is('DELETE', /^\/keys\/([\w-]+)$/)) {
        need({ session: true });
        const k = DB.apiKeys.find((x) => x.id === m[1] && x.userId === auth.user.id && !x.revokedAt);
        if (!k) throw new ApiError(404, 'API key not found');
        k.revokedAt = nowIso();
        return { ok: true };
    }

    /* ---------- webhooks ---------- */
    if (is('GET', /^\/webhooks$/)) {
        need({ session: true, admin: true });
        return {
            webhooks: DB.webhooks.map((w) => {
                const last = DB.deliveries.find((d) => d.webhookId === w.id);
                return { id: w.id, url: w.url, events: w.events, active: w.active, createdAt: w.createdAt, lastDelivery: last ? { ok: last.ok, at: last.createdAt } : null };
            }),
            availableEvents: WEBHOOK_EVENTS,
        };
    }
    if (is('POST', /^\/webhooks$/)) {
        need({ session: true, admin: true });
        let url; try { url = new URL(String(b.url || '')); } catch { throw new ApiError(400, 'Enter a full URL starting with https://'); }
        if (url.protocol !== 'https:') throw new ApiError(400, 'Webhook URLs must use https://');
        const events = Array.isArray(b.events) ? [...new Set(b.events)] : [];
        if (!events.length || !events.every((e) => WEBHOOK_EVENTS.includes(e))) throw new ApiError(400, 'Pick at least one event');
        const secret = 'whsec_' + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
        DB.webhooks.unshift({ id: uid('wh'), url: url.toString(), secret, events, active: true, createdAt: nowIso() });
        return { url: url.toString(), events, secret, note: 'Copy the signing secret now. It will not be shown again.' };
    }
    if (is('DELETE', /^\/webhooks\/([\w-]+)$/)) {
        need({ session: true, admin: true });
        DB.webhooks = DB.webhooks.filter((w) => w.id !== m[1]);
        DB.deliveries = DB.deliveries.filter((d) => d.webhookId !== m[1]);
        return { ok: true };
    }
    if (is('POST', /^\/webhooks\/([\w-]+)\/test$/)) {
        need({ session: true, admin: true });
        const w = DB.webhooks.find((x) => x.id === m[1]);
        if (!w) throw new ApiError(404, 'Webhook not found');
        const createdAt = nowIso();
        DB.deliveries.unshift({ id: uid('whd'), webhookId: w.id, event: 'ping', statusCode: 200, ok: true, error: null, createdAt,
            payload: { id: uid('evt'), event: 'ping', createdAt, data: { message: 'Test event from Merchant Connect Cloud' } } });
        return { ok: true, statusCode: 200, error: null };
    }
    if (is('GET', /^\/webhooks\/([\w-]+)\/deliveries$/)) {
        need({ session: true, admin: true });
        return { deliveries: DB.deliveries.filter((d) => d.webhookId === m[1]).slice(0, 50) };
    }

    throw new ApiError(404, 'Endpoint not found');
}

async function api(path, { method = 'GET', body, apiKey } = {}) {
    await sleep(120); // feel like a network round trip
    const url = new URL(path, 'https://demo.local');
    try {
        const mailBefore = ((DB.emails || [])[0] || {}).id;
        const auth = authenticate(apiKey);
        let result;
        try { result = await demoRoute(method, url.pathname, url.searchParams, body !== undefined ? clone(body) : {}, auth); }
        finally { announceMail(mailBefore); }
        persist();
        return clone(result);
    } catch (e) {
        persist();
        if (e.status === 423 && apiKey === undefined && state.user) { state.user = null; setTimeout(() => renderAuth('login', { alert: e.message }), 0); }
        if (e.status === 401 && apiKey === undefined && !path.startsWith('/auth/')) {
            state.user = null;
            renderAuth('login');
        }
        throw e;
    }
}

function announceMail(beforeId) {
    const all = DB.emails || []; const stop = all.findIndex((m) => m.id === beforeId);
    const fresh = stop === -1 ? (beforeId ? all : all) : all.slice(0, stop);
    if (!fresh.length) return;
    setTimeout(() => {
        fresh.slice(0, 2).forEach((m) => toast(`Email sent to ${m.to}: “${m.subject}”`, 'mail'));
        updateInboxBadge();
    }, 50);
}

const demoKeyFor = (userId) => (DB.apiKeys.find((k) => k.userId === userId && !k.revokedAt) || {}).key || '';



function toast(message, type = 'success') {
    const container = document.getElementById('toast-container');
    const el = document.createElement('div');
    const bg = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : type === 'mail' ? 'bg-slate-700 border border-indigo-400/40' : 'bg-indigo-600';
    el.className = `${bg} text-white px-4 py-3 rounded-xl shadow-xl flex items-center space-x-3 max-w-sm transition-all duration-300 translate-y-2 opacity-0`;
    el.setAttribute('role', 'status');
    const icon = document.createElement('i');
    icon.className = `fa-solid ${type === 'error' ? 'fa-triangle-exclamation' : type === 'mail' ? 'fa-envelope text-indigo-300' : 'fa-circle-check'} text-lg shrink-0`;
    const span = document.createElement('span');
    span.className = 'text-sm font-medium';
    span.textContent = message;
    el.append(icon, span);
    container.appendChild(el);
    setTimeout(() => el.classList.remove('translate-y-2', 'opacity-0'), 30);
    setTimeout(() => { el.classList.add('translate-y-2', 'opacity-0'); setTimeout(() => el.remove(), 300); }, type === 'mail' ? 6000 : 4500);
}

// Disable a form's buttons while a request runs.
async function busy(form, fn) {
    const buttons = form.querySelectorAll('button');
    buttons.forEach((b) => (b.disabled = true));
    try { await fn(); }
    catch (e) { toast(e.message, 'error'); }
    finally { buttons.forEach((b) => (b.disabled = false)); }
}

/* ================================================================
   Event delegation: [data-action] clicks and [data-form] submits
   ================================================================ */
const actions = {};
const forms = {};

document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    if (el.dataset.action === 'modal-backdrop' && e.target !== el) return; // clicks inside the dialog
    const fn = actions[el.dataset.action];
    if (fn) { e.preventDefault(); fn(el.dataset.id, el); }
});
document.addEventListener('submit', (e) => {
    const form = e.target.closest('form[data-form]');
    if (!form) return;
    e.preventDefault();
    const fn = forms[form.dataset.form];
    if (fn) busy(form, () => fn(form, Object.fromEntries(new FormData(form))));
});
document.addEventListener('input', (e) => {
    if (e.target.matches('[data-filter="leads"]')) renderLeadRows();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

/* ================================================================
   Auth screens: sign in, apply, first-time password, reset

const pwChecklist = (id) => `
    <ul id="${id}" class="grid grid-cols-2 gap-x-3 gap-y-1 text-xs mt-2">
        ${PASSWORD_RULES.map(([label]) => `<li data-rule="${esc(label)}" class="text-slate-500"><i class="fa-regular fa-circle mr-1.5"></i>${label}</li>`).join('')}
    </ul>`;
function updatePwChecklist(input) {
    const list = document.getElementById(input.dataset.pwRules);
    if (!list) return;
    PASSWORD_RULES.forEach(([label, test]) => {
        const li = list.querySelector(`[data-rule="${CSS.escape(label)}"]`);
        if (!li) return;
        const ok = test(input.value);
        li.className = ok ? 'text-emerald-400' : 'text-slate-500';
        li.innerHTML = `<i class="fa-${ok ? 'solid fa-circle-check' : 'regular fa-circle'} mr-1.5"></i>${esc(label)}`;
    });
}
const newPasswordFields = (prefix) => `
    <div><label class="${LABEL}" for="${prefix}-pw">New password</label>
        <input id="${prefix}-pw" type="password" name="password" required autocomplete="new-password" data-pw-rules="${prefix}-rules" class="${INPUT}">
        ${pwChecklist(`${prefix}-rules`)}</div>
    <div><label class="${LABEL}" for="${prefix}-pw2">Confirm new password</label>
        <input id="${prefix}-pw2" type="password" name="confirm" required autocomplete="new-password" class="${INPUT}"></div>`;

function authAlert(msg, type = 'error') {
    if (!msg) return '';
    const cls = type === 'error' ? 'bg-rose-500/10 border-rose-500/40 text-rose-200' : type === 'success' ? 'bg-emerald-500/10 border-emerald-500/40 text-emerald-200' : 'bg-indigo-500/10 border-indigo-500/40 text-indigo-200';
    return `<div id="auth-alert" role="alert" class="mb-5 p-3 rounded-xl border text-sm ${cls}">${esc(msg)}</div>`;
}
function showAuthError(form, msg) {
    const old = document.getElementById('auth-alert');
    if (old) old.remove();
    form.insertAdjacentHTML('beforebegin', authAlert(msg));
}

const RANK_STYLES = {
    1: ['bg-amber-300 text-slate-900', 'fa-trophy', '1st place'],
    2: ['bg-slate-300 text-slate-900', 'fa-medal', '2nd place'],
    3: ['bg-peach-400 text-slate-900', 'fa-medal', '3rd place'],
};
async function loadLeaderboard() {
    const box = document.getElementById('leaderboard-body');
    if (!box) return;
    const period = state.lbPeriod || '90';
    let data;
    try { data = await api(`/leaderboard?period=${period}`); }
    catch (e) { box.innerHTML = `<p class="text-sm text-rose-300">${esc(e.message)}</p>`; return; }
    if (!document.body.contains(box)) return;
    const { rows, totals } = data;
    const top = Math.max(1, ...rows.map((r) => r.sales));
    const periodLabel = { '30': 'in the last 30 days', '90': 'in the last 90 days', '365': 'in the last 12 months', all: 'all time' }[period];
    if (!rows.length) { box.innerHTML = '<p class="py-8 text-center text-sm text-slate-400">No active partners yet.</p>'; return; }
    const rankBadge = (r) => {

function drawChart(monthly) {
    const ctx = document.getElementById('perf-chart');
    if (!ctx || !window.Chart) return;
    if (state.chart) state.chart.destroy();
    const months = [];
    const d = new Date();
    d.setDate(1);
    for (let i = 5; i >= 0; i--) {
        const m = new Date(d.getFullYear(), d.getMonth() - i, 1);
        months.push({ key: `${m.getFullYear()}-${String(m.getMonth() + 1).padStart(2, '0')}`, label: m.toLocaleString('en-GB', { month: 'short' }) });
    }
    const byKey = Object.fromEntries(monthly.map((r) => [r.month, r]));
    state.chart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: months.map((m) => m.label),
            datasets: [
                { label: 'Submitted', data: months.map((m) => byKey[m.key]?.submitted || 0), backgroundColor: '#6366f1', borderRadius: 6 },
                { label: 'Sold', data: months.map((m) => byKey[m.key]?.sold || 0), backgroundColor: '#10b981', borderRadius: 6 },
            ],
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { labels: { color: '#cbd5e1' } } },
            scales: {
                x: { grid: { color: 'rgba(51,65,85,.4)' }, ticks: { color: '#94a3b8' } },
                y: { beginAtZero: true, grid: { color: 'rgba(51,65,85,.4)' }, ticks: { color: '#94a3b8', precision: 0 } },
            },
        },
    });
}

forms['create-key'] = async (_, d) => {

    state.playgroundKey = r.key;
    await loadTab();
    secretModal('API key created', 'Your API key', r.key, r.note);

forms.playground = async (_, d) => {
    const out = document.getElementById('playground-result');
    const isPost = d.op === 'post';
    let body;
    if (isPost) {
        try { body = JSON.parse(d.body); } catch { throw new Error('The JSON body is not valid JSON'); }
    }
    let status, data;
    try {
        data = await api(isPost ? '/leads' : '/leads?limit=5', { method: isPost ? 'POST' : 'GET', body, apiKey: d.key.trim() });
        status = isPost && !data.duplicate ? 201 : 200;
    } catch (e) {
        status = e.status || 500;
        data = { error: e.message };
    }
    const ok = status < 300;
    out.innerHTML = `
        <div class="flex items-center gap-3 mb-2 text-xs font-semibold">
            <span class="${ok ? 'text-emerald-400' : 'text-rose-400'}">HTTP ${status}</span>
            ${isPost && ok && !data.duplicate ? '<button data-action="tab" data-id="leads" class="text-indigo-300 hover:text-indigo-200">See it in Leads</button>' : ''}
            ${data.duplicate ? '<span class="text-amber-300">Duplicate externalId: existing lead returned, nothing new created</span>' : ''}
        </div>
        <pre class="bg-slate-950 border border-slate-700 rounded-xl p-4 text-xs text-slate-300 overflow-x-auto max-h-80"><code>${esc(JSON.stringify(data, null, 2))}</code></pre>`;
    if (isPost && ok && !data.duplicate) toast(isAdmin() ? 'Lead received through the API. Check the webhook delivery log.' : 'Lead received through the API');
};

    const y = window.scrollY; await loadTab(); window.scrollTo(0, y);
};

actions['bank-check'] = async () => {
    const out = document.getElementById('bank-check-result');
    const r = await api('/account/bank/check', { method: 'POST', body: { sortCode: document.getElementById('bk-sc').value, accountNumber: document.getElementById('bk-an').value } });
    out.className = `text-sm ${r.valid ? (r.checked ? 'text-emerald-300' : 'text-amber-300') : 'text-rose-300'}`;
    out.innerHTML = `<i class="fa-solid ${r.valid ? (r.checked ? 'fa-circle-check' : 'fa-circle-info') : 'fa-circle-xmark'} mr-1"></i>${esc(r.valid && r.checked ? 'These details pass the modulus check.' : r.reason)}`;
};
// Input masks: sort code as 00-00-00, account number digits only
document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.dataset && t.dataset.pwRules) updatePwChecklist(t);
    if (t.dataset && t.dataset.mask === 'digits') t.value = t.value.replace(/\D/g, '').slice(0, 8);
    if (t.dataset && t.dataset.mask === 'sortcode') { const d = t.value.replace(/\D/g, '').slice(0, 6); t.value = d.replace(/(\d{2})(?=\d)/g, '$1-'); }
    if (t.dataset && (t.dataset.mask === 'digits' || t.dataset.mask === 'sortcode')) { const out = document.getElementById('bank-check-result'); if (out) out.textContent = ''; }
    if (t.matches && t.matches('[data-filter="inbox"]')) { state.inboxFilter = t.value; actions['open-inbox'](null, { dataset: { to: t.value } }); }
});

   Admin: Partners (applications, access, account information)

const MASKED_PASSWORD = '••••••••••••';
function partnerStatusBadge(u) {
    if (u.locked) return '<span class="inline-flex px-3 py-1 rounded-full text-xs font-bold border bg-rose-500/20 text-rose-300 border-rose-500/30 whitespace-nowrap"><i class="fa-solid fa-lock mr-1"></i>Locked</span>';
    const map = {
        pending: ['Application pending', 'bg-amber-500/20 text-amber-300 border-amber-500/30'],
        awaiting_password: ['Awaiting password', 'bg-blue-500/20 text-blue-300 border-blue-500/30'],
        active: ['Active', 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30'],
        rejected: ['Rejected', 'bg-rose-500/20 text-rose-300 border-rose-500/30'],
        deactivated: ['Deactivated', 'bg-slate-500/20 text-slate-300 border-slate-500/30'],
    };
    const [label, cls] = map[u.status] || [u.status, map.deactivated[1]];
    return `<span class="inline-flex px-3 py-1 rounded-full text-xs font-bold border whitespace-nowrap ${cls}">${label}</span>`;
}
const passwordCell = (u) => u.passwordSet
    ? `<div class="font-mono text-slate-300 tracking-wider" aria-label="Password set, hidden">${MASKED_PASSWORD}</div><div class="text-[11px] text-slate-500">Set ${fmtDate(u.passwordSetAt)}</div>`
    : u.status === 'awaiting_password' ? `<div class="text-xs text-blue-300">One-time password sent</div><div class="text-[11px] text-slate-500">Expires ${fmtDateTime(u.otpExpiresAt)}</div>`
    : '<div class="text-xs text-slate-500">Not set</div>';
function partnerActions(u) {
    const b = (act, label, cls = 'bg-slate-700 hover:bg-slate-600') => `<button data-action="partner-${act}" data-id="${esc(u.id)}" class="px-3 py-1.5 ${cls} text-white rounded-xl text-xs font-semibold">${label}</button>`;
    const out = [b('view', 'View')];
    if (u.status === 'pending') out.push(b('approve', 'Approve', 'bg-emerald-600 hover:bg-emerald-500'), b('reject', 'Reject', 'bg-slate-700 hover:bg-rose-600/40'));
    if (u.status === 'awaiting_password') out.push(b('resend-otp', 'Resend one-time password'));
    if (u.locked) out.push(b('unlock', 'Unlock', 'bg-emerald-600 hover:bg-emerald-500'));
    if (u.status === 'active' && !u.locked) out.push(b('deactivate', 'Deactivate', 'bg-slate-700 hover:bg-rose-600/40'));
    if (u.status === 'deactivated') out.push(b('reactivate', 'Reactivate'));
    return out.join(' ');
}

async function viewPartners(el) {
    const { users } = await api('/users');
    state.partnerList = users;
    const partners = users.filter((u) => u.role === 'seller');
    const count = (f) => partners.filter(f).length;
    el.innerHTML = `
        <div class="space-y-6">
            <div><h2 class="text-2xl font-bold text-white">Partners</h2>
                <p class="text-sm text-slate-400">Approve applications, manage sign-in access, and review each partner’s account information.</p></div>
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                ${[['Applications to review', count((u) => u.status === 'pending'), 'amber'], ['Awaiting password', count((u) => u.status === 'awaiting_password'), 'blue'], ['Active partners', count((u) => u.status === 'active' && !u.locked), 'emerald'], ['Locked out', count((u) => u.locked), 'rose']]
                    .map(([l, n, c]) => `<div class="${CARD} p-4"><div class="text-xs font-bold text-slate-400">${l}</div><div class="text-2xl font-extrabold text-${c}-300 mt-1">${n}</div></div>`).join('')}
            </div>
            <div class="${CARD} overflow-hidden"><div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead><tr class="bg-slate-900/60 border-b border-slate-700 text-xs text-slate-400 font-semibold">
                        <th class="p-4">Partner</th><th class="p-4">Status</th><th class="p-4">Password</th><th class="p-4">Sign-in</th><th class="p-4">Account info</th><th class="p-4 text-right">Actions</th></tr></thead>
                    <tbody class="divide-y divide-slate-700/60 text-slate-300">
                    ${partners.map((u) => `
                        <tr class="hover:bg-slate-700/30">
                            <td class="p-4"><div class="font-bold text-white">${esc(u.name)}</div><div class="text-xs text-slate-400">${esc(u.profile.fullName)}${u.profile.fullName ? ' · ' : ''}${esc(u.email)}</div><div class="text-[11px] text-slate-500">Applied ${fmtDate(u.createdAt)}</div></td>
                            <td class="p-4">${partnerStatusBadge(u)}</td>
                            <td class="p-4">${passwordCell(u)}</td>
                            <td class="p-4 text-xs whitespace-nowrap">${u.locked ? `<span class="text-rose-300">Locked ${fmtDateTime(u.lockedAt)}</span>` : u.failedAttempts ? `<span class="text-amber-300">${u.failedAttempts} failed attempt${u.failedAttempts > 1 ? 's' : ''}</span>` : u.lastSignInAt ? `Last ${fmtDate(u.lastSignInAt)}` : '<span class="text-slate-500">Never signed in</span>'}</td>
                            <td class="p-4 text-xs"><span class="${u.profile.completeness.done === 6 ? 'text-emerald-300' : 'text-slate-300'}">${u.profile.completeness.done} of 6</span>
                                ${u.profile.bank ? `<div class="text-[11px] ${u.profile.bank.check.status === 'passed' ? 'text-emerald-400' : 'text-amber-300'}">Bank ${u.profile.bank.check.status === 'passed' ? 'verified' : 'not checkable'}</div>` : ''}</td>
                            <td class="p-4 text-right whitespace-nowrap space-x-1">${partnerActions(u)}</td>
                        </tr>`).join('')}
                    </tbody>
                </table>
            </div></div>
            <p class="text-xs text-slate-500"><i class="fa-solid fa-shield-halved mr-1"></i>Passwords are stored as one-way hashes (PBKDF2-SHA-256). Nobody, including administrators, can see or recover a partner’s password. Partners who forget theirs use “Forgot your password?”. Bank account numbers are masked to the last four digits.</p>
        </div>`;
}

            <div class="md:col-span-2">${block('Right to work in the UK', p.completeness.sections.rightToWork, r ? `${row('Basis', esc(r.basis))}${row('Share code', r.shareCode ? `<span class="font-mono">${esc(r.shareCode)}</span>` : 'Not required')}${row('Signed', `${esc(r.signedName)}, ${fmtDateTime(r.declaredAt)}`)}` : row('Declaration', ''))}</div>
        </div>
        <div class="flex flex-wrap justify-end gap-2 mt-5">${partnerActions(u).replace(/<button data-action="partner-view"[^>]*>View<\/button>/, '')}<button data-action="close-modal" class="${BTN_GHOST}">Close</button></div>`, 'max-w-3xl');
};

async function viewAdmin(el) {
    const { settings: s } = await api('/settings');

    el.innerHTML = `
        <div class="space-y-6 max-w-5xl">
            <div><h2 class="text-2xl font-bold text-white">Settings</h2>
                <p class="text-sm text-slate-400">Commission rules for new leads. Partner applications and access are managed on the Partners page.</p></div>

            <section class="${CARD} p-6">
                <form data-form="settings" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div><label class="${LABEL}" for="s-flat">Commission per lead (£)</label>
                            <input id="s-flat" type="number" step="0.01" min="0" name="flatCommissionRate" value="${s.flatCommissionRate}" required class="${INPUT}">
                            <p class="text-xs text-slate-500 mt-1">Set on each new lead. Paid out once the lead is marked Sold.</p></div>
                        <div><label class="${LABEL}" for="s-bonus">High-volume bonus (£)</label>
                            <input id="s-bonus" type="number" step="0.01" min="0" name="highVolumeBonus" value="${s.highVolumeBonus}" required class="${INPUT}">
                            <p class="text-xs text-slate-500 mt-1">Added when the merchant takes £50,000+ in card payments per month.</p></div>
                    </div>
                    <label class="flex items-start gap-3"><input type="checkbox" name="autoQualifyLeads" ${s.autoQualifyLeads ? 'checked' : ''} class="w-4 h-4 mt-0.5">
                        <span><span class="text-sm font-semibold text-white block">Auto-qualify new leads</span>
                        <span class="text-xs text-slate-400">New leads start as Qualified instead of Pending Review.</span></span></label>
                    <div class="pt-4 border-t border-slate-700 flex justify-end"><button type="submit" class="${BTN_PRIMARY}">Save settings</button></div>
                </form>
            </section>

        </div>`;
}

forms.settings = async (_, d) => {
    await api('/settings', { method: 'PUT', body: {
        flatCommissionRate: Number(d.flatCommissionRate),
        highVolumeBonus: Number(d.highVolumeBonus),
        autoQualifyLeads: d.autoQualifyLeads === 'on',
    } });
    toast('Settings saved');
};

/* ================================================================
   Boot
   ================================================================ */
(async function boot() {
    try {
        state.user = (await api('/auth/me')).user;
        renderMain();
    } catch {
        renderAuth('login');
    }
})();
</script>
</body>
</html>
